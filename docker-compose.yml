name: auxiliador-biblico

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biblia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-biblia}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    restart: unless-stopped
    # Rede do host: as páginas de impressão (PDF) buscam a API em 127.0.0.1:8000, que roda fora do Docker.
    # Só escuta em 127.0.0.1. No macOS, ative "host networking" no Docker Desktop ou rode a interface com npm.
    network_mode: host
    environment:
      HOSTNAME: 127.0.0.1
      PORT: "3000"

volumes:
  pgdata:
